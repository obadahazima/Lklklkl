<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Billy Bills logo">
  <defs>
    <mask id="m">
      <!-- Use the existing logo-symbol PNG as the mask source; non-transparent areas become visible -->
      <image href="/logo-symbol.png" x="0" y="0" width="128" height="128" preserveAspectRatio="xMidYMid meet" />
    </mask>
  </defs>
  <!-- Draw a white rectangle masked by the logo to show only the logo shape in white -->
  <rect width="100%" height="100%" fill="#ffffff" mask="url(#m)" />
</svg>